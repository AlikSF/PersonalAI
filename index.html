<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/palm tree.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Phuket Vibe Tours</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TourOperator",
      "name": "PhuketVibe",
      "image": "https://phuketvibe.com/logo.jpg",
      "telephone": "+66 97 213 7197",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "105 Phangmuang Sai Kor Rd",
        "addressLocality": "Patong",
        "addressRegion": "Kathu District, Phuket",
        "postalCode": "83150",
        "addressCountry": "TH"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 7.8965,
        "longitude": 98.2963
      },
      "url": "https://phuketvibe.com",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "10:00",
          "closes": "22:00"
        }
      ],
      "priceRange": "$$",
      "areaServed": {
        "@type": "Place",
        "name": "Phuket, Thailand"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
